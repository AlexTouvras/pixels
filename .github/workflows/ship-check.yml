name: Ship check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ship-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Deploy-safe commit author (master pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/check-deploy-author.mjs

      - name: Ship checks
        run: npm run ship:check
